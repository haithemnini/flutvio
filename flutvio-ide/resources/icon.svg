<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#3A7BFF"/>
      <stop offset="1" stop-color="#5B3FE6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="80" y="80" width="864" height="864" rx="196" fill="url(#bg)"/>
  <rect x="80" y="80" width="864" height="864" rx="196" fill="url(#shine)"/>
  <!-- Flutter-style diagonal bar -->
  <line x1="660" y1="270" x2="352" y2="578" stroke="#FFFFFF" stroke-width="132" stroke-linecap="round"/>
  <!-- Flutvio's touch: the lower chevron becomes a "run" triangle -->
